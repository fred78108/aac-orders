[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aac-orders"
version = "0.1.0"
description = "Event-driven order fulfillment platform (Docker Compose / microservices)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
docs = [
    "diagrams>=0.24",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "tox>=4",
]
services = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "aio-pika>=9.4",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic-settings>=2.2",
]

[tool.setuptools.packages.find]
where = ["services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.tox]
env_list = ["py312", "lint", "type"]

[tool.tox.env_run_base]
description = "run tests under {env_name}"
package = "editable"
extras = ["dev"]
commands = [["pytest", "tests"]]

[tool.tox.env.lint]
description = "lint and format-check with ruff"
skip_install = true
deps = ["ruff>=0.4"]
commands = [
    ["ruff", "check", "."],
    ["ruff", "format", "--check", "."],
]

[tool.tox.env.type]
description = "type-check with mypy"
package = "editable"
extras = ["dev", "services"]
commands = [["mypy", "services/"]]
